spring:
  cloud:
    config:
      server:
        git:
          uri: https://example.com/dummy/config-repo.git
          clone-on-start: false
        health:
          enabled: false
        encrypt:
          enabled: false

config-server:
  security:
    users:
      gateway:
        password: test
        roles: CONFIG_CLIENT
      actuator:
        password: test
        roles: ACTUATOR

encrypt:
  key: test-encryption-key

management:
  endpoints:
    web:
      exposure:
        include: health, info