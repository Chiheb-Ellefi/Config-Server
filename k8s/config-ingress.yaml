apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: config-server-ingress
  namespace: config

spec:
  podSelector:
    matchLabels:
      app: config-service
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              config-access: "true"
      ports:
        - port: 8888
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9090

