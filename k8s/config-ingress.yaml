apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: config-ingress
  namespace: config

spec:
  ingressClassName: nginx
  rules:
    - host: config.local
      http:
        paths:
          - backend:
              service:
                name: config-service
                port:
                  number: 8888
            path: /
            pathType: Prefix
