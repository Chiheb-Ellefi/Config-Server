apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-deployment
  namespace: config
  labels:
    app: config
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config
      env: dev
      version: "1.0.0"
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 5
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 300
  paused: false
  template:
    metadata:
      name: config-pod
      namespace: config
      labels:
        app: config
        env: dev
        version: "1.0.0"
    spec:
      containers:
        - name: config
          image: "config:1.0.1"
          imagePullPolicy: Never
          ports:
            - name: "http"
              containerPort: 8888
              protocol: TCP
          envFrom:
            - configMapRef:
                name: config-server-config
            - secretRef:
                name: config-server-secret
          resources:
            requests:
              cpu: "1"
              memory: "500Mi"
              ephemeral-storage: "1Gi"
            limits:
              cpu: "2"
              memory: "1Gi"
              ephemeral-storage: "2Gi"
          startupProbe:
            httpGet:
              port: http
              path: "/actuator/health/liveness"
              scheme: HTTP
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/liveness"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              port: http
              scheme: HTTP
              path: "/actuator/health/readiness"
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "sleep 5" ]


      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst



---

apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: config
  labels:
    app: config
    env: dev
    version: "1.0.0"
spec:
  type: ClusterIP
  selector:
    app: config
    env: dev
    version: "1.0.0"
  ports:
    - name: http
      protocol: TCP
      port: 8888
      targetPort: http
