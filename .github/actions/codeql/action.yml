name: codeql
author: ${{github.repository_owner}}
description: Semantic code analysis against the  repository's source code to find security vulnerabilities
runs:
  using: composite
  steps:
    - name: CodeQL init
      uses: github/codeql-action/init@v4
      with:
        languages: java
    - run: mvn -B -DskipTests package
      shell: bash
    - name: CodeQL analyze
      uses: github/codeql-action/analyze@v4